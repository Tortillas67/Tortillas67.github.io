
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Personal</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header{
            background-color: #0066cc;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main{
            padding: 20px;
            text-align: center;
        }

        .empleado{
            display: inline-block;
            margin: 15px;
            background-color: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        .empleado img{
            width: 100px;
            height: auto;
            border-radius: 8px;
        }

        .nombre{
            margin-top: 10px;
            font-weight: bold;
        }

        footer{
            background-color: #0066cc;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Directorio de Personal</h1>
        <p>Tortillas 67</p>
    </header>

    <main>

        <div class="empleado">
            <img src="https://tortillas67.github.io/Fotos%20de%20Tortillas67/Cesar%20Quintal.jpeg" alt="Cesar Quintal">
            <div class="nombre">Cesar Quintal</div>
        </div>

        <div class="empleado">
            <img src="https://tortillas67.github.io/Fotos%20de%20Tortillas67/Erick%20Meneses.jpeg" alt="Erick Meneses">
            <div class="nombre">Erick Meneses</div>
        </div>

        <div class="empleado">
            <img src="https://tortillas67.github.io/Fotos%20de%20Tortillas67/Jacqueline%20Pat.jpeg" alt="Jacqueline Pat">
            <div class="nombre">Jacqueline Pat</div>
        </div>

        <div class="empleado">
            <img src="https://tortillas67.github.io/Fotos%20de%20Tortillas67/Victor%20Julian.jpeg" alt="Victor Julian">
            <div class="nombre">Victor Julian</div>
        </div>

    </main>

    <footer>
        © 2026 Tortillas 67 | Todos los derechos reservados
    </footer>

</body>
</html>
